<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页深色</title>
    <style type="text/css">
        body{
            background-color:black;
            color: white;
            text-align: center;
        }
        .a{
            position: absolute;
            top: 50px;
            left:50%;
            transform: translateX(-50%);
            
        }
        .b{
            background-color: aqua;
            color: black;
            width:200px;
            position: absolute;
            top: 120px;
            left:50%;
            transform: translateX(-50%);
            border-radius: 10px;
        }
        .c{
            position: absolute;
            top: 180px;
            left:40%;
            transform: translateX(-50%);
            background-color: aqua;
            color: black;
            width:150px;
            border-radius: 10px;
        }
        .d{
            position: absolute;
            top: 180px;
            left:60%;
            transform: translateX(-50%);
            background-color: aqua;
            color: black;
            width:150px;
            border-radius: 10px;
        }
    </style>
    
</head>
<body>
    <h1>---Chicken Club---</h1>
    <div class="a">
        <p>---最新版本:10.1.0001///<br>///当前已是最新版本---</p>
    </div>
    <div class="b">
        <p id="s">点击此处以自定义文字</p>
    </div>
    <div class="c">
        <a href="PC.html">切换到PC端</a>
    </div>
    <div class="d">
        <a href="index.html">浅色模式</a>
    </div>
    <script>
        s.onclick=function(){
        let text=prompt("请输入文本但不要输入空白，否则会变成滚木")
        s.innerText=text}
    </script>
</body>
</html>
